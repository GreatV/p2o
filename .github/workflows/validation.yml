name: Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full manifest (all models) instead of the typical subset"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  regression:
    name: Regression
    needs: rust-checks
    # Typical subset on push to main / dispatch / PRs labeled `run-regression`.
    # Full manifest only via dispatch with `full=true` (or locally: omit `--models`).
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-regression'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Covers det/rec/layout/formula/uvdoc over tar + hf paths. All downloadable
      # from the manifest source; all run live Paddle except ppdoclayoutv2 (baseline).
      TYPICAL_MODELS: >-
        ppocrv5_det
        ppocrv5_rec
        ppocrv6_tiny_det
        ppocrv6_tiny_rec
        ppformulanet_l
        uvdoc
        ppdoclayoutv2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve regression scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            echo "models_flag=" >> "$GITHUB_OUTPUT"
            echo "cache_tag=full" >> "$GITHUB_OUTPUT"
            echo "scope=full manifest (all models)" >> "$GITHUB_OUTPUT"
          else
            echo "models_flag=--models ${TYPICAL_MODELS}" >> "$GITHUB_OUTPUT"
            echo "cache_tag=typical" >> "$GITHUB_OUTPUT"
            echo "scope=typical subset: ${TYPICAL_MODELS}" >> "$GITHUB_OUTPUT"
          fi
          echo "Regression scope: $(cat "$GITHUB_OUTPUT" | grep '^scope=' | cut -d= -f2-)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build converter
        # Regression converts with target/debug/p2o; build here so compile errors
        # fail fast before downloading models.
        run: cargo build

      - name: Cache regression models
        uses: actions/cache@v4
        with:
          path: inference_models
          key: regression-models-v1-${{ hashFiles('scripts/regression_models.json') }}-${{ steps.scope.outputs.cache_tag }}
          restore-keys: |
            regression-models-v1-${{ hashFiles('scripts/regression_models.json') }}-

      - name: Download regression models
        run: |
          python3 scripts/download_regression_models.py \
            --manifest scripts/regression_models.json \
            ${{ steps.scope.outputs.models_flag }}

      - name: Install regression dependencies
        # Keep in sync with pyproject.toml's `regression` group.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 onnxruntime==1.23.2 paddlepaddle==3.2.2 "setuptools>=69"

      - name: Run regression
        run: |
          python scripts/regression_suite.py diff \
            --manifest scripts/regression_models.json \
            ${{ steps.scope.outputs.models_flag }} \
            --json-out /tmp/p2o_regression_ci.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ steps.scope.outputs.cache_tag }}
          path: /tmp/p2o_regression_ci.json
