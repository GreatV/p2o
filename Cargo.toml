[package]
name = "p2o"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "p2o"
path = "src/main.rs"

[dependencies]
prost = "0.13.4"
prost-types = "0.13.4"
bytes = "1.5"
byteorder = "1.5"
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.0", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.10"
half = "2.7.1"

[build-dependencies]
prost-build = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.27.0"
