[package]
name = "p2o"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13.4"
prost-types = "0.13.4"
bytes = "1.5"
byteorder = "1.5"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.0", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.10"

[build-dependencies]
prost-build = "0.13.4"

[dev-dependencies]
tempfile = "3.27.0"
