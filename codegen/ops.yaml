op_type_map:
  - paddle: ["conv2d", "depthwise_conv2d"]
    onnx: "Conv"
  - paddle: ["add"]
    onnx: "Add"
  - paddle: ["relu"]
    onnx: "Relu"
  - paddle: ["pool2d"]
    onnx: "MaxPool"
  - paddle: ["batch_norm", "batch_norm_"]
    onnx: "BatchNormalization"
  - paddle: ["matmul", "matmul_v2", "bmm"]
    onnx: "MatMul"
  - paddle: ["reshape"]
    onnx: "Reshape"
  - paddle: ["transpose"]
    onnx: "Transpose"
  - paddle: ["softmax"]
    onnx: "Softmax"
  - paddle: ["conv2d_transpose"]
    onnx: "ConvTranspose"
  - paddle: ["nearest_interp"]
    onnx: "Resize"
  - paddle: ["sigmoid"]
    onnx: "Sigmoid"
  - paddle: ["assign", "share_data"]
    onnx: "Identity"
  - paddle: ["equal"]
    onnx: "Equal"
  - paddle: ["shape64", "shape"]
    onnx: "Shape"
  - paddle: ["flatten"]
    onnx: "Flatten"
  - paddle: ["hardsigmoid"]
    onnx: "HardSigmoid"
  - paddle: ["hardswish"]
    onnx: "HardSwish"
  - paddle: ["layer_norm"]
    onnx: "LayerNormalization"
  - paddle: ["logical_and", "bitwise_and"]
    onnx: "And"
  - paddle: ["logical_not"]
    onnx: "Not"
  - paddle: ["logical_or"]
    onnx: "Or"
  - paddle: ["squeeze", "squeeze_"]
    onnx: "Squeeze"
  - paddle: ["unsqueeze", "unsqueeze_"]
    onnx: "Unsqueeze"
  - paddle: ["clip"]
    onnx: "Clip"
  - paddle: ["ceil"]
    onnx: "Ceil"
  - paddle: ["divide"]
    onnx: "Div"
  - paddle: ["floor"]
    onnx: "Floor"
  - paddle: ["gather_nd"]
    onnx: "GatherND"
  - paddle: ["log"]
    onnx: "Log"
  - paddle: ["multiply"]
    onnx: "Mul"
  - paddle: ["range", "arange"]
    onnx: "Range"
  - paddle: ["remainder"]
    onnx: "Mod"
  - paddle: ["subtract"]
    onnx: "Sub"
  - paddle: ["tanh"]
    onnx: "Tanh"
  - paddle: ["tile"]
    onnx: "Tile"
  - paddle: ["where"]
    onnx: "Where"
  - paddle: ["abs"]
    onnx: "Abs"
  - paddle: ["cos"]
    onnx: "Cos"
  - paddle: ["elementwise_pow"]
    onnx: "Pow"
  - paddle: ["expand"]
    onnx: "Expand"
  - paddle: ["greater_equal"]
    onnx: "GreaterOrEqual"
  - paddle: ["greater_than"]
    onnx: "Greater"
  - paddle: ["sin"]
    onnx: "Sin"
  - paddle: ["less_equal"]
    onnx: "LessOrEqual"
  - paddle: ["less_than"]
