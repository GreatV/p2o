pass2_dispatch:
  # Operators listed here use dedicated pass2 handlers. Other "1.*" operators
  # fall back to generic ONNX op mapping through op_type_map below.
  - op: "p"
    kind: noop
    method: pass2_noop
  - op: "0.combine"
    kind: noop
    method: pass2_noop
  - op: "0.split"
    kind: noop
    method: pass2_noop
  - op: "1.full"
    kind: typed
    method: op_full
  - op: "1.full_int_array"
    kind: typed
    method: op_full
  - op: "1.assign_value_"
    kind: simple
    method: op_assign_value
  - op: "1.data"
    kind: simple
    method: op_data
  - op: "1.fetch"
    kind: simple
    method: op_fetch
  - op: "1.cast"
    kind: simple
    method: op_cast
  - op: "1.matmul"
    kind: simple
    method: op_matmul
  - op: "1.matmul_v2"
    kind: simple
    method: op_matmul
  - op: "1.clip"
    kind: simple
    method: op_clip
  - op: "1.slice"
    kind: simple
    method: op_slice
  - op: "1.squeeze"
    kind: simple
    method: op_squeeze
  - op: "1.squeeze_"
    kind: simple
    method: op_squeeze
  - op: "1.unsqueeze"
    kind: simple
    method: op_unsqueeze
  - op: "1.unsqueeze_"
    kind: simple
    method: op_unsqueeze
  - op: "1.flatten"
    kind: simple
    method: op_flatten
  - op: "1.scale"
    kind: simple
    method: op_scale
  - op: "1.swish"
    kind: simple
    method: op_swish
  - op: "1.silu"
    kind: simple
    method: op_silu
  - op: "1.hardswish"
    kind: simple
    method: op_hardswish
  - op: "1.gelu"
    kind: simple
    method: op_gelu
  - op: "1.stack"
    kind: simple
    method: op_stack
  - op: "1.concat"
    kind: simple
    method: op_concat
  - op: "1.split"
    kind: typed
    method: op_split_family
  - op: "1.split_with_num"
    kind: typed
    method: op_split_family
  - op: "1.nearest_interp"
    kind: simple
    method: op_nearest_interp
  - op: "1.bilinear_interp"
    kind: simple
    method: op_bilinear_interp
  - op: "1.arange"
    kind: simple
    method: op_arange
  - op: "1.pool2d"
    kind: simple
    method: op_pool2d
  - op: "1.batch_norm_"
    kind: simple
    method: op_batch_norm
  - op: "1.batch_norm"
    kind: simple
    method: op_batch_norm
  - op: "1.conv2d_transpose"
    kind: simple
    method: op_conv2d_transpose
  - op: "1.conv2d_transpose_"
    kind: simple
    method: op_conv2d_transpose
  - op: "1.expand"
    kind: simple
    method: op_expand
  - op: "1.full_like"
    kind: simple
    method: op_full_like
  - op: "1.full_with_tensor"
    kind: simple
    method: op_full_with_tensor
  - op: "1.eye"
    kind: simple
    method: op_eye
  - op: "1.max"
    kind: simple
    method: op_reduce_max
  - op: "1.mean"
    kind: simple
    method: op_reduce_mean
  - op: "1.min"
